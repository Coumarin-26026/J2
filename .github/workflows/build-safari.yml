name: Build J2TEAM Security Safari iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Safari iOS Extension
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Check source ZIP
      # ============================================================
      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail

          ZIP="J2TEAM-Security-2.4.2-source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Source archive not found: $ZIP"
            echo
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found source archive:"
          ls -lh "$ZIP"


      # ============================================================
      # 3. Prepare build directories
      # ============================================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          mkdir -p build/extracted
          mkdir -p build/extension
          mkdir -p build/safari
          mkdir -p build/archive


      # ============================================================
      # 4. Extract J2TEAM Security 2.4.2
      # ============================================================
      - name: Extract J2TEAM Security
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "J2TEAM-Security-2.4.2-source.zip" \
            -d build/extracted

          echo "=== Extracted files ==="
          find build/extracted -maxdepth 3 -print | sort

          SOURCE_DIR="build/extracted/source"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Expected source directory not found:"
            echo "$SOURCE_DIR"
            exit 1
          fi

          cp -R \
            "$SOURCE_DIR/." \
            "build/extension/"

          echo
          echo "J2TEAM source copied to:"
          echo "build/extension"


      # ============================================================
      # 5. Verify manifest
      # ============================================================
      - name: Verify extension
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="build/extension/manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::manifest.json not found"
            exit 1
          fi

          echo "=== manifest.json ==="
          cat "$MANIFEST"

          echo
          echo "=== Extension information ==="

          /usr/bin/python3 <<'PY'
          import json

          path = "build/extension/manifest.json"

          with open(path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          print("Name:", manifest.get("name"))
          print("Version:", manifest.get("version"))
          print("Manifest version:", manifest.get("manifest_version"))
          print("Background:", manifest.get("background"))
          print("Permissions:", manifest.get("permissions"))
          print("Host permissions:", manifest.get("host_permissions"))
          PY


      # ============================================================
      # 6. Check Xcode
      # ============================================================
      - name: Check Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== Developer directory ==="
          xcode-select -p

          echo
          echo "=== Safari Web Extension Packager ==="
          xcrun --find safari-web-extension-packager


      # ============================================================
      # 7. Create Safari iOS project
      # ============================================================
      - name: Package Safari iOS extension
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/safari
          mkdir -p build/safari

          xcrun safari-web-extension-packager \
            "build/extension" \
            --ios-only \
            --copy-resources \
            --app-name "J2TEAM Security" \
            --bundle-identifier "com.coumarin.j2teamsecurity" \
            --swift \
            --project-location "build/safari" \
            --no-open \
            --no-prompt \
            --force

          echo
          echo "Safari project generated successfully."


      # ============================================================
      # 8. Locate Xcode project
      # ============================================================
      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Generated Safari project ==="
          find build/safari \
            -maxdepth 5 \
            -print \
            | sort

          echo
          echo "=== Searching for Xcode project ==="

          PROJECT=""

          while IFS= read -r candidate; do
            if [ -z "$PROJECT" ]; then
              PROJECT="$candidate"
            fi
          done <<EOF
          $(find build/safari \
            -name "*.xcodeproj" \
            -type d \
            -print)
          EOF

          if [ -z "$PROJECT" ]; then
            echo "::error::No Xcode project found."
            exit 1
          fi

          echo
          echo "Selected Xcode project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 9. Inspect Xcode project
      # ============================================================
      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "=== Xcode project ==="
          echo "$PROJECT"

          echo
          echo "=== Targets / configurations / schemes ==="

          xcodebuild \
            -project "$PROJECT" \
            -list


      # ============================================================
      # 10. Detect scheme
      # ============================================================
      - name: Detect Xcode scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Inspecting schemes..."

          LIST="$(
            xcodebuild \
              -project "$PROJECT" \
              -list 2>&1
          )"

          echo
          echo "=== xcodebuild -list ==="
          echo "$LIST"

          echo
          echo "=== Available schemes ==="

          SCHEMES="$(
            printf '%s\n' "$LIST" |
            awk '
              /^Schemes:/ {
                in_schemes=1
                next
              }

              in_schemes && /^[[:space:]]*$/ {
                exit
              }

              in_schemes {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)

                if ($0 != "") {
                  print $0
                }
              }
            '
          )"

          if [ -z "$SCHEMES" ]; then
            echo "::error::No schemes detected."
            exit 1
          fi

          printf '%s\n' "$SCHEMES"

          echo
          echo "=== Selecting scheme ==="

          # Prefer J2TEAM/Safari/iOS-related scheme.
          SCHEME="$(
            printf '%s\n' "$SCHEMES" |
            grep -Ei 'j2team|safari|ios' |
            head -n 1 ||
            true
          )"

          # If no matching scheme exists, use first available scheme.
          if [ -z "$SCHEME" ]; then
            SCHEME="$(
              printf '%s\n' "$SCHEMES" |
              head -n 1
            )"
          fi

          SCHEME="$(printf '%s' "$SCHEME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [ -z "$SCHEME" ]; then
            echo "::error::Could not determine Xcode scheme."
            exit 1
          fi

          echo
          echo "Selected scheme:"
          echo "$SCHEME"

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. Build iOS archive without signing
      # ============================================================
      - name: Build iOS archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          ARCHIVE="$PWD/build/archive/J2TEAM-Security.xcarchive"

          echo "=========================================="
          echo "Building J2TEAM Security"
          echo "=========================================="
          echo
          echo "Project:"
          echo "$PROJECT"
          echo
          echo "Scheme:"
          echo "$SCHEME"
          echo
          echo "Archive:"
          echo "$ARCHIVE"
          echo

          rm -rf "$ARCHIVE"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive


      # ============================================================
      # 12. Inspect archive
      # ============================================================
      - name: Inspect archive
        if: always()
        shell: bash
        run: |
          echo "=== Build directory ==="

          find build \
            -maxdepth 6 \
            -print \
            | sort

          echo
          echo "=== Archive ==="

          if [ -d "build/archive/J2TEAM-Security.xcarchive" ]; then

            echo "Archive created successfully."

            ls -lah \
              "build/archive/J2TEAM-Security.xcarchive"

            echo
            echo "Products:"

            find \
              "build/archive/J2TEAM-Security.xcarchive/Products" \
              -maxdepth 6 \
              -print \
              2>/dev/null || true

          else

            echo "Archive was NOT created."

          fi


      # ============================================================
      # 13. Upload generated Safari project
      # ============================================================
      - name: Upload Safari iOS project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Safari-iOS-project
          path: build/safari/
          if-no-files-found: warn


      # ============================================================
      # 14. Upload Xcode archive
      # ============================================================
      - name: Upload Xcode archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Security-iOS-archive
          path: build/archive/
          if-no-files-found: warn


      # ============================================================
      # 15. Upload converted extension
      # ============================================================
      - name: Upload Safari extension resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Security-Safari-extension
          path: build/extension/
          if-no-files-found: warn
