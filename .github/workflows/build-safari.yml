name: Build J2TEAM Security Safari iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Safari iOS Extension
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Check source ZIP
      # ============================================================
      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail

          ZIP="J2TEAM-Security-2.4.2-source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Source archive not found: $ZIP"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Source archive:"
          ls -lh "$ZIP"


      # ============================================================
      # 3. Prepare build directories
      # ============================================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          mkdir -p build/extracted
          mkdir -p build/extension
          mkdir -p build/safari
          mkdir -p build/archive


      # ============================================================
      # 4. Extract J2TEAM Security 2.4.2
      # ============================================================
      - name: Extract J2TEAM Security
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "J2TEAM-Security-2.4.2-source.zip" \
            -d build/extracted

          echo "=== Extracted ==="
          find build/extracted -maxdepth 3 -print | sort

          SOURCE_DIR="build/extracted/source"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::source directory not found"
            exit 1
          fi

          cp -R \
            "$SOURCE_DIR/." \
            "build/extension/"


      # ============================================================
      # 5. Verify manifest
      # ============================================================
      - name: Verify manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="build/extension/manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::manifest.json not found"
            exit 1
          fi

          /usr/bin/python3 <<'PY'
          import json

          path = "build/extension/manifest.json"

          with open(path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          print("Name:", manifest.get("name"))
          print("Version:", manifest.get("version"))
          print("Manifest:", manifest.get("manifest_version"))
          PY


      # ============================================================
      # 6. Check Xcode
      # ============================================================
      - name: Check Xcode
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcode-select -p

          echo
          echo "Safari Web Extension Packager:"
          xcrun --find safari-web-extension-packager


      # ============================================================
      # 7. Generate Safari iOS project
      # ============================================================
      - name: Generate Safari iOS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/safari
          mkdir -p build/safari

          xcrun safari-web-extension-packager \
            "build/extension" \
            --ios-only \
            --copy-resources \
            --app-name "J2TEAM Security" \
            --bundle-identifier "com.coumarin.j2teamsecurity" \
            --swift \
            --project-location "build/safari" \
            --no-open \
            --no-prompt \
            --force

          echo
          echo "Safari project generated."


      # ============================================================
      # 8. Locate Xcode project
      # ============================================================
      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          while IFS= read -r candidate; do
            if [ -z "$PROJECT" ]; then
              PROJECT="$candidate"
            fi
          done <<EOF
          $(find build/safari -type d -name "*.xcodeproj" -print)
          EOF

          if [ -z "$PROJECT" ]; then
            echo "::error::No Xcode project found."
            find build/safari -maxdepth 5 -print
            exit 1
          fi

          echo "Xcode project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 9. List project
      # ============================================================
      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "=== Xcode project ==="
          echo "$PROJECT"

          echo
          echo "=== xcodebuild -list ==="

          xcodebuild \
            -project "$PROJECT" \
            -list


      # ============================================================
      # 10. Detect scheme
      # ============================================================
      - name: Detect Xcode scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Detecting scheme..."

          LIST="$(
            xcodebuild \
              -project "$PROJECT" \
              -list 2>&1
          )"

          echo
          echo "=== xcodebuild -list ==="
          echo "$LIST"

          echo
          echo "=== Parsing scheme ==="

          # Extract everything after "Schemes:"
          # and take the first non-empty line.
          SCHEME="$(
            printf '%s\n' "$LIST" |
            sed -n '/Schemes:/,$p' |
            tail -n +2 |
            sed '/^[[:space:]]*$/d' |
            head -n 1 |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          if [ -z "$SCHEME" ]; then
            echo "::error::Could not detect scheme from xcodebuild."
            exit 1
          fi

          echo
          echo "======================================"
          echo "Detected scheme:"
          echo "$SCHEME"
          echo "======================================"

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. Verify scheme
      # ============================================================
      - name: Verify selected scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          echo "Project:"
          echo "$PROJECT"

          echo
          echo "Scheme:"
          echo "$SCHEME"

          echo
          echo "Testing scheme..."

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -showBuildSettings \
            -configuration Release \
            -sdk iphoneos \
            >/dev/null

          echo "Scheme is valid."


      # ============================================================
      # 12. Build iOS archive
      # ============================================================
      - name: Build iOS archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          ARCHIVE="$PWD/build/archive/J2TEAM-Security.xcarchive"

          rm -rf "$ARCHIVE"

          echo "======================================"
          echo "Building"
          echo "======================================"
          echo "Project: $PROJECT"
          echo "Scheme:  $SCHEME"
          echo "SDK:     iphoneos"
          echo "Archive: $ARCHIVE"
          echo

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive


      # ============================================================
      # 13. Inspect result
      # ============================================================
      - name: Inspect build result
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find build \
            -maxdepth 7 \
            -print \
            | sort

          echo

          if [ -d "build/archive/J2TEAM-Security.xcarchive" ]; then
            echo "Archive created:"
            ls -lah \
              "build/archive/J2TEAM-Security.xcarchive"
          else
            echo "Archive was not created."
          fi


      # ============================================================
      # 14. Upload Safari project
      # ============================================================
      - name: Upload Safari iOS project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Safari-iOS-project
          path: build/safari/
          if-no-files-found: warn


      # ============================================================
      # 15. Upload archive
      # ============================================================
      - name: Upload iOS archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Security-iOS-archive
          path: build/archive/
          if-no-files-found: warn


      # ============================================================
      # 16. Upload converted extension
      # ============================================================
      - name: Upload Safari extension
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Security-Safari-extension
          path: build/extension/
          if-no-files-found: warn
