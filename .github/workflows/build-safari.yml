name: Build J2TEAM Security Safari iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build J2TEAM Security for Safari iOS
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Locate source ZIP
      # ============================================================
      - name: Locate J2TEAM source
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f -print | sort

          ZIP="J2TEAM-Security-2.4.2-source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Cannot find $ZIP"

            FOUND="$(find . -type f \
              \( -name '*.zip' -o -name '*.ZIP' \) \
              -print)"

            echo
            echo "ZIP files found:"
            echo "$FOUND"

            exit 1
          fi

          echo
          echo "Source archive:"
          ls -lh "$ZIP"


      # ============================================================
      # 3. Prepare directories
      # ============================================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          mkdir -p \
            build/extracted \
            build/extension \
            build/safari \
            build/archive \
            build/output


      # ============================================================
      # 4. Extract source
      # ============================================================
      - name: Extract J2TEAM Security source
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "J2TEAM-Security-2.4.2-source.zip" \
            -d build/extracted

          echo "=== Extracted files ==="

          find build/extracted \
            -maxdepth 3 \
            -print \
            | sort

          SOURCE_DIR="build/extracted/source"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Expected source directory not found:"
            echo "$SOURCE_DIR"

            find build/extracted \
              -maxdepth 2 \
              -type d \
              -print

            exit 1
          fi

          cp -R \
            "$SOURCE_DIR/." \
            "build/extension/"

          echo
          echo "Extension source copied."


      # ============================================================
      # 5. Verify manifest
      # ============================================================
      - name: Verify Chrome extension source
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="build/extension/manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::manifest.json not found."
            exit 1
          fi

          python3 <<'PY'
          import json

          path = "build/extension/manifest.json"

          with open(path, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          print("======================================")
          print("J2TEAM Security")
          print("======================================")
          print("Name:            ", manifest.get("name"))
          print("Version:         ", manifest.get("version"))
          print("Manifest version:", manifest.get("manifest_version"))
          print("======================================")
          PY


      # ============================================================
      # 6. Check Xcode
      # ============================================================
      - name: Check Xcode environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== Developer directory ==="
          xcode-select -p

          echo
          echo "=== Safari Web Extension Packager ==="

          if ! xcrun --find safari-web-extension-packager; then
            echo "::error::Safari Web Extension Packager not found."
            exit 1
          fi

          xcrun --find safari-web-extension-packager


      # ============================================================
      # 7. Generate Safari iOS project
      # ============================================================
      - name: Generate Safari iOS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/safari

          mkdir -p build/safari

          echo "Generating Safari project..."

          xcrun safari-web-extension-packager \
            "build/extension" \
            --ios-only \
            --copy-resources \
            --app-name "J2TEAM Security" \
            --bundle-identifier "com.coumarin.j2teamsecurity" \
            --swift \
            --project-location "build/safari" \
            --no-open \
            --no-prompt \
            --force

          echo
          echo "=== Generated Safari project ==="

          find build/safari \
            -maxdepth 5 \
            -print \
            | sort


      # ============================================================
      # 8. Locate Xcode project
      # ============================================================
      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(
            find "build/safari" \
              -type d \
              -name "*.xcodeproj" \
              -print \
              | head -n 1
          )"

          if [ -z "$PROJECT" ]; then
            echo "::error::No Xcode project found."

            find build/safari \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "======================================"
          echo "Xcode project:"
          echo "$PROJECT"
          echo "======================================"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 9. Inspect Xcode project
      # ============================================================
      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "=== xcodebuild -list ==="

          xcodebuild \
            -project "$PROJECT" \
            -list


      # ============================================================
      # 10. Detect scheme
      # ============================================================
      - name: Detect Xcode scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          LIST="$(
            xcodebuild \
              -project "$PROJECT" \
              -list 2>&1
          )"

          echo "=== Xcode project information ==="
          echo "$LIST"

          echo
          echo "=== Detecting scheme ==="

          SCHEME="$(
            printf '%s\n' "$LIST" |
            sed -n '/Schemes:/,$p' |
            tail -n +2 |
            sed '/^[[:space:]]*$/d' |
            head -n 1 |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"

          if [ -z "$SCHEME" ]; then
            echo "::error::Unable to detect Xcode scheme."
            exit 1
          fi

          echo
          echo "Detected scheme:"
          echo "$SCHEME"

          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. Verify scheme
      # ============================================================
      - name: Verify Xcode scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          echo "Project:"
          echo "$PROJECT"

          echo
          echo "Scheme:"
          echo "$SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            >/tmp/j2team-build-settings.txt

          echo
          echo "Scheme verified successfully."


      # ============================================================
      # 12. Fix Bundle IDs
      # ============================================================
      - name: Fix Safari bundle identifiers
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="build/safari/J2TEAM Security"

          PROJECT_FILE="$PROJECT_DIR/J2TEAM Security.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "::error::project.pbxproj not found:"
            echo "$PROJECT_FILE"
            exit 1
          fi

          echo "======================================"
          echo "Bundle IDs BEFORE fix"
          echo "======================================"

          grep \
            -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            "$PROJECT_FILE" \
            || true

          echo
          echo "======================================"
          echo "Fixing Bundle IDs"
          echo "======================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "build/safari/J2TEAM Security/"
              "J2TEAM Security.xcodeproj/"
              "project.pbxproj"
          )

          text = path.read_text(encoding="utf-8")

          # The packager generated:
          #
          # com.coumarin.J2TEAM-Security
          #
          # while the extension uses:
          #
          # com.coumarin.j2teamsecurity.Extension
          #
          # iOS requires the extension bundle ID to be prefixed
          # by the parent application's bundle ID.

          text = text.replace(
              "com.coumarin.J2TEAM-Security",
              "com.coumarin.j2teamsecurity"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Bundle ID replacement completed.")
          PY

          echo
          echo "======================================"
          echo "Bundle IDs AFTER fix"
          echo "======================================"

          grep \
            -n \
            "PRODUCT_BUNDLE_IDENTIFIER" \
            "$PROJECT_FILE" \
            || true


      # ============================================================
      # 13. Verify Bundle IDs using Xcode
      # ============================================================
      - name: Verify Bundle IDs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          SETTINGS="$(
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -showBuildSettings
          )"

          echo "======================================"
          echo "Bundle identifiers"
          echo "======================================"

          printf '%s\n' "$SETTINGS" |
            grep \
              "PRODUCT_BUNDLE_IDENTIFIER" \
              || true

          echo
          echo "Checking project.pbxproj..."

          PROJECT_FILE="build/safari/J2TEAM Security/J2TEAM Security.xcodeproj/project.pbxproj"

          if grep -q \
            "com.coumarin.J2TEAM-Security" \
            "$PROJECT_FILE"; then

            echo "::error::Old app Bundle ID still exists."
            exit 1
          fi

          if ! grep -q \
            "com.coumarin.j2teamsecurity" \
            "$PROJECT_FILE"; then

            echo "::error::New app Bundle ID not found."
            exit 1
          fi

          if ! grep -q \
            "com.coumarin.j2teamsecurity.Extension" \
            "$PROJECT_FILE"; then

            echo "::error::Extension Bundle ID not found."
            exit 1
          fi

          echo
          echo "Bundle IDs are consistent."


      # ============================================================
      # 14. Verify extension relationship
      # ============================================================
      - name: Verify app and extension relationship
        shell: bash
        run: |
          set -euo pipefail

          APP_ID="com.coumarin.j2teamsecurity"
          EXT_ID="com.coumarin.j2teamsecurity.Extension"

          echo "Parent:"
          echo "$APP_ID"

          echo
          echo "Extension:"
          echo "$EXT_ID"

          case "$EXT_ID" in
            "$APP_ID".*)
              echo
              echo "Extension Bundle ID is correctly prefixed."
              ;;
            *)
              echo
              echo "::error::Extension Bundle ID is NOT prefixed by parent."
              exit 1
              ;;
          esac


      # ============================================================
      # 15. Clean build
      # ============================================================
      - name: Clean Xcode build
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            clean


      # ============================================================
      # 16. Build iOS archive
      # ============================================================
      - name: Build iOS archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          ARCHIVE="$PWD/build/archive/J2TEAM-Security.xcarchive"

          rm -rf "$ARCHIVE"

          echo "======================================"
          echo "Building iOS archive"
          echo "======================================"

          echo "Project:"
          echo "$PROJECT"

          echo
          echo "Scheme:"
          echo "$SCHEME"

          echo
          echo "SDK:"
          echo "iphoneos"

          echo
          echo "Archive:"
          echo "$ARCHIVE"

          echo

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive


      # ============================================================
      # 17. Verify archive
      # ============================================================
      - name: Verify archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="build/archive/J2TEAM-Security.xcarchive"

          echo "======================================"
          echo "Archive verification"
          echo "======================================"

          if [ ! -d "$ARCHIVE" ]; then
            echo "::error::Archive was not created."
            exit 1
          fi

          echo
          echo "Archive created successfully:"
          ls -lah "$ARCHIVE"

          echo
          echo "Products:"
          find "$ARCHIVE/Products" \
            -maxdepth 5 \
            -print \
            | sort

          echo
          echo "Info:"
          if [ -f "$ARCHIVE/Info.plist" ]; then
            plutil \
              -p \
              "$ARCHIVE/Info.plist"
          fi


      # ============================================================
      # 18. Locate application
      # ============================================================
      - name: Locate built application
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Built applications"
          echo "======================================"

          find build \
            -type d \
            -name "*.app" \
            -print \
            | sort \
            || true

          echo
          echo "Safari extensions:"

          find build \
            -type d \
            -name "*.appex" \
            -print \
            | sort \
            || true


      # ============================================================
      # 19. Export project artifact
      # ============================================================
      - name: Upload Safari Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Security-Safari-iOS-project
          path: build/safari/
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # 20. Upload archive
      # ============================================================
      - name: Upload XCArchive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Security-iOS-XCArchive
          path: build/archive/
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # 21. Upload converted extension source
      # ============================================================
      - name: Upload Safari extension source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2TEAM-Security-Safari-extension-source
          path: build/extension/
          if-no-files-found: warn
          retention-days: 7
